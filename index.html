<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shadi Khodagholi — portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Shadi Khodagholi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css?v=4" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    body { font-family: "Instrument Serif", Georgia, serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="data.js?v=3"></script>
  <script type="text/babel" src="components-base.jsx?v=3"></script>
  <script type="text/babel" src="components-bg.jsx?v=3"></script>
  <script type="text/babel" src="components-hero.jsx?v=3"></script>
  <script type="text/babel" src="components-sections.jsx?v=3"></script>
  <script type="text/babel" src="tweaks-panel.jsx?v=3"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const TWEAK_DEFAULTS = {
      "accent": "#c9a96a",
      "heroVariant": "big"
    };

    const ACCENT_PRESETS = [
      { id: "gold",   label: "gold",   color: "#c9a96a" },
      { id: "ember",  label: "ember",  color: "#e07a5f" },
      { id: "moss",   label: "moss",   color: "#9bbf7a" },
      { id: "ice",    label: "ice",    color: "#7fb3d5" },
      { id: "violet", label: "violet", color: "#b39ddb" },
      { id: "rose",   label: "rose",   color: "#e0789b" },
    ];

    const HERO_VARIANTS = [
      { value: "live",  label: "live"  },
      { value: "typer", label: "typer" },
      { value: "big",   label: "big"   },
    ];

    const NAV = [
      { id: "home",        label: "home",       hue: "accent" },
      { id: "research",    label: "research",   hue: "#86efac" },
      { id: "education",   label: "education",  hue: "#93c5fd" },
      { id: "papers",      label: "papers",     hue: "#fcd34d" },
      { id: "experience",  label: "experience", hue: "#fda4af" },
      { id: "projects",    label: "projects",   hue: "#d8b4fe" },
      { id: "off-screen",  label: "off-screen", hue: "#f0abfc" },
    ];

    // ── Thin scroll-progress bar pinned to the very top of the viewport.
    function ScrollProgress({ accent }) {
      const [p, setP] = useState(0);
      useEffect(() => {
        let raf = 0;
        const onScroll = () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            const h = document.documentElement;
            const max = h.scrollHeight - h.clientHeight;
            setP(max > 0 ? h.scrollTop / max : 0);
          });
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      return (
        <div className="scroll-progress" aria-hidden="true">
          <span className="scroll-progress-fill"
                style={{ transform: `scaleX(${p})`, background: accent }} />
        </div>
      );
    }

    // ── Floating mini-map of the page outline. One hued pip per section; the
    //    active one expands and reveals its label. Click to jump.
    function SectionRail({ items, active, accent, onJump }) {
      return (
        <nav className="rail" aria-label="page outline">
          {items.map((s, i) => {
            const c = s.hue === "accent" ? accent : s.hue;
            const on = active === s.id;
            return (
              <button key={s.id}
                      className={"rail-item" + (on ? " active" : "")}
                      style={{ "--dot-c": c }}
                      aria-label={s.label}
                      aria-current={on ? "true" : undefined}
                      onClick={() => onJump(s.id)}>
                <span className="rail-label mono">{String(i).padStart(2,"0")} {s.label}</span>
                <span className="rail-pip" />
              </button>
            );
          })}
        </nav>
      );
    }

    // ── A soft glow that trails the cursor — gives the dark page some life.
    function CursorGlow({ accent }) {
      const ref = useRef(null);
      useEffect(() => {
        let raf = 0, tx = -999, ty = -999, x = -999, y = -999;
        const onMove = (e) => { tx = e.clientX; ty = e.clientY; if (!raf) raf = requestAnimationFrame(tick); };
        const tick = () => {
          raf = 0;
          x += (tx - x) * 0.16; y += (ty - y) * 0.16;
          if (ref.current) ref.current.style.transform = `translate(${x}px, ${y}px)`;
          if (Math.abs(tx - x) > 0.5 || Math.abs(ty - y) > 0.5) raf = requestAnimationFrame(tick);
        };
        window.addEventListener("pointermove", onMove, { passive: true });
        return () => window.removeEventListener("pointermove", onMove);
      }, []);
      return <div ref={ref} className="cursor-glow" aria-hidden="true"
                  style={{ background: `radial-gradient(circle, ${accent}22, transparent 60%)` }} />;
    }

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [active, setActive] = useState("home");
      const lockRef = useRef({ id: null, until: 0 });
      const accent = tweaks.accent;
      const data = window.PORTFOLIO;

      useEffect(() => {
        document.documentElement.style.setProperty("--accent", accent);
      }, [accent]);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          if (Date.now() < lockRef.current.until) return;
          entries.forEach((e) => {
            if (e.isIntersecting) setActive(e.target.id);
          });
        }, { rootMargin: "-40% 0px -55% 0px", threshold: 0 });
        NAV.forEach(s => {
          const el = document.getElementById(s.id);
          if (el) observer.observe(el);
        });
        return () => observer.disconnect();
      }, []);

      // Reveal each section as it scrolls into view (sections already on screen
      // at load fire immediately, so the hero is never hidden).
      useEffect(() => {
        const reveal = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in-view");
              reveal.unobserve(e.target);
            }
          });
        }, { rootMargin: "0px 0px -12% 0px", threshold: 0.08 });
        document.querySelectorAll(".section").forEach(el => {
          el.classList.add("reveal");
          reveal.observe(el);
        });
        return () => reveal.disconnect();
      }, []);

      const goTo = (id) => {
        const el = document.getElementById(id);
        if (!el) return;
        lockRef.current = { id, until: Date.now() + 1200 };
        setActive(id);
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        history.replaceState(null, "", "#" + id);
      };

      const handleNavClick = (e, id) => {
        e.preventDefault();
        goTo(id);
      };

      // Keyboard navigation: ↓/j → next section, ↑/k → previous, Home/End → ends.
      useEffect(() => {
        const onKey = (e) => {
          const t = e.target;
          if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const i = NAV.findIndex(s => s.id === active);
          let next = null;
          if (e.key === "ArrowDown" || e.key === "j") next = NAV[Math.min(i + 1, NAV.length - 1)];
          else if (e.key === "ArrowUp" || e.key === "k") next = NAV[Math.max(i - 1, 0)];
          else if (e.key === "Home") next = NAV[0];
          else if (e.key === "End") next = NAV[NAV.length - 1];
          if (next) { e.preventDefault(); goTo(next.id); }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [active]);

      return (
        <>
          <BioBackground />
          <CursorGlow accent={accent} />
          <ScrollProgress accent={accent} />
          <SectionRail items={NAV} active={active} accent={accent} onJump={goTo} />
          <nav className="nav">
            <div className="nav-inner">
              <div className="nav-brand">
                <span className="glyph">z</span>
                <span>shadi.kh</span>
                <span className="dim" style={{marginLeft:6}}>· portfolio</span>
              </div>
              <div className="nav-links">
                {NAV.map((s, i) => (
                  <a key={s.id}
                     href={"#" + s.id}
                     data-id={s.id}
                     onClick={(e) => handleNavClick(e, s.id)}
                     className={"nav-link " + (active === s.id ? "active" : "")}>
                    <span className="num">{String(i).padStart(2,"0")}</span>{s.label}
                  </a>
                ))}
              </div>
            </div>
          </nav>

          <main className="page">
            <section id="home" className="section" style={{paddingTop: 0, paddingBottom: 16, borderTop: "none"}}>
              <Hero variant={tweaks.heroVariant} data={data} accent={accent} />
            </section>

            <section id="research" className="section">
              <SectionHead num="01" title="Research focus" subtitle="threads I'm pulling on right now" accent="#86efac" />
              <div className="proj-grid" style={{gridTemplateColumns:"1fr 1fr"}}>
                {data.research_areas.map((r, i) => (
                  <div key={i} className="proj-card" style={{cursor:"default"}}>
                    <div className="proj-num mono" style={{color: "#86efac"}}>area · {String(i+1).padStart(2,"0")}</div>
                    <div className="proj-title">{r.tag}</div>
                    <p className="proj-detail" style={{marginTop:8}}>{r.note}</p>
                  </div>
                ))}
              </div>
            </section>

            <section id="education" className="section">
              <SectionHead num="02" title="Education" accent="#93c5fd" />
              <Education items={data.education} accent="#93c5fd" />
            </section>

            <section id="papers" className="section">
              <SectionHead num="03" title="Papers" accent="#fcd34d" />
              <div className="paper-grid">
                {data.papers.map((p) => <PaperCard key={p.id} paper={p} accent="#fcd34d" />)}
              </div>
            </section>

            <section id="experience" className="section">
              <SectionHead num="04" title="Experience" subtitle="research, eng, teaching" accent="#fda4af" />
              <Experience items={data.experience} accent="#fda4af" />
            </section>

            <section id="projects" className="section">
              <SectionHead num="05" title="Side projects" subtitle="coursework + things I built to learn" accent="#d8b4fe" />
              <Projects items={data.projects} accent="#d8b4fe" />
            </section>

            <section id="off-screen" className="section">
              <SectionHead num="06" title="Off‑screen" subtitle="when the laptop is closed" accent="#f0abfc" />
              <Offscreen data={data} accent="#f0abfc" />
            </section>

            <footer className="foot">
              <div>
                <span className="dim">© 2026 · </span>
                {data.name} ·{" "}
                <a href={"mailto:" + data.links.email}>{data.links.email}</a>
              </div>
              <div className="dim">
                built in html · last commit{" "}
                <span style={{color: accent}}>{(new Date()).toISOString().slice(0,10)}</span>
              </div>
            </footer>
          </main>

          <TweaksPanel title="Tweaks" defaultPosition={{ right: 20, bottom: 20 }}>
            <TweakSection label="Accent">
              <TweakColor
                label="Color"
                value={tweaks.accent}
                onChange={(v) => setTweak("accent", v)}
              />
              <div style={{display:"flex", flexWrap:"wrap", gap:6, marginTop:6}}>
                {ACCENT_PRESETS.map(p => (
                  <button key={p.id}
                          onClick={() => setTweak("accent", p.color)}
                          title={p.label}
                          style={{
                            width: 26, height: 26, borderRadius: 4,
                            border: tweaks.accent.toLowerCase() === p.color.toLowerCase()
                              ? "2px solid #fff" : "1px solid #444",
                            background: p.color, cursor: "pointer", padding: 0,
                          }}/>
                ))}
              </div>
            </TweakSection>
            <TweakSection label="Hero variant">
              <TweakRadio
                label="Variant"
                value={tweaks.heroVariant}
                onChange={(v) => setTweak("heroVariant", v)}
                options={HERO_VARIANTS}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
